[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "latos"
version = "0.4.2"
description = "An original English-first small language model project"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastien Lato" }]
dependencies = [
    "torch==2.14.0",
    "numpy==2.5.3",
    "tokenizers==0.23.2",
    "safetensors==0.8.0",
]

[project.scripts]
latos = "latos.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "hatchling==1.32.0"]

[tool.uv]
required-version = "==0.12.15"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'x86_64')",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/latos"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/docs", "/.github", "/.python-version",
    "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE",
    "/AGENTS.md", "/PROJECT_STATE.md", "/ROADMAP.md", "/DECISIONS.md",
    "/THIRD_PARTY.md", "/CHANGELOG.md", "/.gitignore", "/.gitattributes",
    "/data/manifests", "/data/fixtures", "/experiments/phase-1", "/experiments/phase-2",
    "/configs", "/experiments/phase-3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
