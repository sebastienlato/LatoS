[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "latos"
version = "0.1.0"
description = "An original English-first small language model project"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sebastien Lato" }]
dependencies = ["torch==2.14.0", "numpy==2.5.3"]

[project.scripts]
latos = "latos.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "hatchling==1.32.0"]

[tool.uv]
required-version = "==0.12.15"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/latos"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/docs", "/.github", "/.python-version",
    "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE",
    "/AGENTS.md", "/PROJECT_STATE.md", "/ROADMAP.md", "/DECISIONS.md",
    "/THIRD_PARTY.md", "/CHANGELOG.md", "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
